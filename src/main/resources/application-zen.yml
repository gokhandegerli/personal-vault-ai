spring:
  ai:
    # Chat via OpenCode Zen (free models, e.g. big-pickle); embedding stays local via Ollama.
    model:
      chat: openai
      embedding: ollama
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${ZEN_BASE_URL:https://opencode.ai/zen/v1}
      chat:
        options:
          model: ${ZEN_CHAT_MODEL:big-pickle}
          temperature: 0.3
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
